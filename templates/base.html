<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>{{ page_title }} · {{ site.title }}</title>
<link rel="manifest" href="{{ root }}/manifest.webmanifest">
<link rel="icon" href="{{ root }}/assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="{{ root }}/assets/apple-touch-icon.png">
<link rel="stylesheet" href="{{ root }}/assets/style.css">
<script>
  // 首屏前应用主题与字号，避免闪烁
  (function () {
    try {
      var t = localStorage.getItem('pr-theme') || 'auto';
      if (t !== 'auto') document.documentElement.dataset.theme = t;
      var fs = localStorage.getItem('pr-fs');
      if (fs) document.documentElement.style.setProperty('--fs', fs + 'px');
      var m = localStorage.getItem('pr-mode');
      if (m) document.documentElement.dataset.mode = m;
    } catch (e) {}
  })();
</script>
</head>
<body data-page="{{ 'article' if a is defined else 'list' }}">

<header class="topbar">
  <div class="topbar-inner">
    {% block topbar %}
    <a class="brand" href="{{ root }}/index.html">
      <span class="brand-mark">读</span>
      <span class="brand-text">{{ site.title }}</span>
    </a>
    <div class="topbar-right">
      <button class="icon-btn" data-act="theme" aria-label="切换主题">◐</button>
    </div>
    {% endblock %}
  </div>
  {% block progress %}{% endblock %}
</header>

<main class="wrap">
  {% block body %}{% endblock %}
</main>

{% block footer %}
<footer class="foot">
  <p>{{ site.title }} · {{ site.subtitle }}</p>
  <p class="dim">数据来自各刊官方 RSS / 开放平台，版权归原作者所有 · 更新于 {{ updated_at }}</p>
  <p class="dim">最近构建 {{ updated_at }} · 共 {{ total }} 篇</p>
</footer>
{% endblock %}

<nav class="tabbar">
  <a href="{{ root }}/index.html" class="{{ 'on' if a is undefined and is_index is defined and is_index else '' }}">
    <span class="ti">▤</span><span>今日</span>
  </a>
  <a href="{{ root }}/archive.html" class="{{ 'on' if page_title == '全部归档' else '' }}">
    <span class="ti">☰</span><span>归档</span>
  </a>
  <a href="{{ root }}/about.html" class="{{ 'on' if page_title == '关于' else '' }}">
    <span class="ti">ⓘ</span><span>关于</span>
  </a>
</nav>

<script src="{{ root }}/assets/app.js" defer></script>
</body>
</html>
